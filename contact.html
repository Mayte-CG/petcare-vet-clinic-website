<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link href="./css/styles.css" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./js/script.js" defer></script>
    <title>Contact Us | Petcare</title>
</head>

<body>
    <header class="contact-page-header">
        <nav>
            <a href="./index.html#home"><img src="./assets/icons/petcare-logo.png" alt="Petcare logo" class="logo" /></a>
            <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false"
                aria-controls="primary-navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul id="primary-navigation">
                <li><a href="./index.html#home">Home</a></li>
                <li><a href="./index.html#services">Services</a></li>
                <li><a href="./index.html#about">About us</a></li>
                <li><a href="./index.html#pricing">Pricing</a></li>
                <li><a href="./index.html#testimonials">Testimonials</a></li>
                <li><a href="./contact.html" class="active" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <div class="contact-content">
                <header class="contact-header">
                    <h1>Contact us</h1>
                    <p>Have a question or need help? We’d love to hear from you.</p>
                </header>
                <form class="contact-form">
                    <div class="form-field">
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text" autocomplete="name" required>
                    </div>
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="form-field">
                        <label for="subject">Subject</label>
                        <textarea id="subject" name="subject" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="cta-button">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-column">
                <h3>Follow PetCare</h3>
                <p>Get pet-care tips, clinic updates, and stories from the pets we help.</p>
                <a href="#" aria-label="Visit our Instagram page">
                    <img src="./assets/icons/instagram.png" alt="" class="social-media-image" />
                </a>
                <a href="#" aria-label="Visit our Facebook page">
                    <img src="./assets/icons/facebook.png" alt="" class="social-media-image" />
                </a>
                <a href="#" aria-label="Visit our Twitter page">
                    <img src="./assets/icons/twitter.png" alt="" class="social-media-image" />
                </a>
                <a href="#" aria-label="Contact us on WhatsApp">
                    <img src="./assets/icons/whats-app.png" alt="" class="social-media-image" />
                </a>
            </div>
            <div class="footer-column">
                <h3>Have questions?</h3>
                <p>We’re here to help you and your pet.</p>
                <a href="./contact.html" class="contact-link">Contact us</a>
            </div>
        </div>
    </footer>
</body>

</html>
